version = "3.8.6"
runner.dialect = scala3
maxColumn = 120

align.preset = more
rewrite.scala3.insertEndMarkerMinLines = 20
rewrite.scala3.convertToNewSyntax = true
rewrite.scala3.removeOptionalBraces.enabled = true

fileOverride {
  "glob:**/*.sbt" {
    runner.dialect = scala3
  }
  "glob:project/**/*.scala" {
    runner.dialect = scala3
    rewrite.scala3.convertToNewSyntax = false
    rewrite.scala3.removeOptionalBraces.enabled = false
  }
}

project.excludePaths = [
  "glob:**/src/main/scala-generated/**",
  "glob:project/**",
  "glob:**/vendor/**"
]
